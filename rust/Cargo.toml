[package]
name = "cswebservo"
version = "0.2.0"
edition = "2024"

[lib]
name = "cswebservo"
crate-type = ["cdylib"]

[dependencies]
libservo = {
    package = "servo",
    git = "https://github.com/servo/servo",
    rev = "f0c02de154a7f6f4c62de0d8d929e488cf667f54",
    features = ["baked-in-resources"]
}
dpi = "0.1.2"
url = "2.5.8"
log = "0.4"

[profile.release]
opt-level = 2
lto = false
debug = false
strip = false
codegen-units = 16
incremental = true

[profile.dev]
debug = true
opt-level = 0
strip = false

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
